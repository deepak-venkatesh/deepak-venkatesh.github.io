<p><em>By Vikram Seth</em></p>
<p><br></p>
<p>All you who sleep tonight</p>
<p>Far from the ones you love,</p>
<p>No hand to left or right,</p>
<p>And emptiness above -</p>
<p><br></p>
<p>Know that you aren’t alone.</p>
<p>The whole world shares your tears,</p>
<p>Some for two nights or one,</p>
<p>And some for all their years.</p>
